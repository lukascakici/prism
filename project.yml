# XcodeGen configuration — `xcodegen generate` produces Prism.xcodeproj.
# If you don't want to use XcodeGen, follow the manual setup steps in the README.

name: Prism
options:
  bundleIdPrefix: com.prism
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    # Ad-hoc signing for local development — host and extension are always signed
    # with the same "signature" (none), making "matching certificate" errors
    # physically impossible. macOS QuickLook loads ad-hoc signed appex bundles.
    # For Mac App Store / notarized distribution: Style→Automatic, Team→<yours>.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
    DEVELOPMENT_TEAM: ""
    # Hardened runtime conflicts with ad-hoc signing; re-enable for release.
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:

  Prism:
    type: application
    platform: macOS
    sources:
      - path: Prism
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prism.host
        INFOPLIST_FILE: Prism/Info.plist
        CODE_SIGN_ENTITLEMENTS: Prism/Prism.entitlements
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: PrismQuickLook
        embed: true
        codeSign: true

  PrismQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: PrismQuickLook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prism.host.PrismQuickLook
        INFOPLIST_FILE: PrismQuickLook/Info.plist
        CODE_SIGN_ENTITLEMENTS: PrismQuickLook/PrismQuickLook.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

# We define only one scheme: `Prism`. This scheme builds both the host and the
# extension, and ⌘R launches Prism.app. No confusing second extension scheme
# clutters the dropdown.
schemeTemplates: {}
schemes:
  Prism:
    build:
      targets:
        Prism: all
        PrismQuickLook: all
    run:
      config: Debug
      executable: Prism
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
